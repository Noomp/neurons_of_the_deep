[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "babytext"
version = "0.1.0"
description = "Minimal BabyAI-Text environment on Farama MiniGrid (SC4001 group project)"
requires-python = ">=3.10"
dependencies = [
    "minigrid>=3.0",
    "gymnasium>=1.0",
    "numpy",
    "matplotlib",
    "pillow",
    "tqdm",
]

[project.optional-dependencies]
dev = ["pytest", "pygame-ce"]

[tool.setuptools]
packages = ["babytext"]

[tool.pytest.ini_options]
testpaths = ["tests"]
