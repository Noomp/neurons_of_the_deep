[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "sc4001-grp-proj"
version = "0.1.0"
description = "SC4001 group project: action heads on frozen LLMs in a BabyAI-Text-style gridworld"
requires-python = ">=3.10"
dependencies = [
    "minigrid>=3.0",
    "gymnasium>=1.0",
    "numpy",
    "matplotlib",
    "pillow",
    "tqdm",
]

[project.optional-dependencies]
dev = ["pytest", "pygame-ce"]
# PyTorch is installed with conda (pytorch-gpu) in the neurons env; see environment.yml.
models = ["torch>=2.4"]

[tool.setuptools]
# babytext: the environment (with its tools); models: experiment code.
packages = ["babytext", "babytext.tools", "models"]
# Root-level config.py (all project settings) is importable as `config`.
py-modules = ["config"]

[tool.pytest.ini_options]
# Environment tests live with the environment; experiment tests in tests/.
testpaths = ["babytext/tests", "tests"]
