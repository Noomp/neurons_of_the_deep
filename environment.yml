# conda env create -f environment.yml && conda activate neurons && pip install -e .
# Model-side packages (torch, transformers, ...) are not included yet; add them
# here once the team settles on versions for their GPU / CUDA setup.
name: neurons
channels:
  - defaults
dependencies:
  - python=3.11
  - pip
  - pip:
      - minigrid==3.2.0
      - gymnasium==1.4.0
      - numpy==2.4.6
      - matplotlib==3.11.2
      - pillow==13.0.0
      - tqdm==4.70.1
      - pytest==9.1.1
      - pygame-ce==2.5.8
